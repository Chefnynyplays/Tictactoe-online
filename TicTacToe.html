<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,
initial-scale=1.0">
<title>Tic Tac Toe</title>
<link rel="stylesheet" href="tictactoe.css">
</head>
<body>
<h1>Tic Tac Toe</h1>
<hr>
Screen 1: player names
<div id="setup-screen">
<h2>Who's playing?</h2>
<div class="name-row">
<label for="player1-name">Player 1 (O)</label>
<input type="text" id="player1-name" maxlength="15"
placeholder="Enter name">
</div>
<div class="name-row">
<label for="player2-name">Player 2 (X)</label>
<input type="text" id="player2-name" maxlength="15"
placeholder="Enter name">
</div>
<p id="setup-error"></p>
<button id="start-button" class="game-button">Start
Game</button>
</div>
<!-- Screen 2: the game -->
<div id="game-screen" class="hidden">
<div id="scoreboard">
<div class="score-box" id="score-box-O">
<span class="score-name" id="name-O"></span>
<span class="score-value" id="score-O">0</span>

</div>
<div class="score-box">
<span class="score-name">Draws</span>
<span class="score-value" id="score-draws">0</span>
</div>
<div class="score-box" id="score-box-X">
<span class="score-name" id="name-X"></span>
<span class="score-value" id="score-X">0</span>
</div>
</div>
<p id="status"></p>
<div id="game-board">
<div data-cell-index="0" class="game-cell"></div>
<div data-cell-index="1" class="game-cell"></div>
<div data-cell-index="2" class="game-cell"></div>
<div data-cell-index="3" class="game-cell"></div>
<div data-cell-index="4" class="game-cell"></div>
<div data-cell-index="5" class="game-cell"></div>
<div data-cell-index="6" class="game-cell"></div>
<div data-cell-index="7" class="game-cell"></div>
<div data-cell-index="8" class="game-cell"></div>
</div>
<button id="game-restart-button" class="game-button">Next
Round</button>
<button id="new-players-button" class="game-button">New
Players</button>
</div>
<script src="tictactoe.js"></script>
</body>
</html>
